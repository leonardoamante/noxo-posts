name: Despertador

# Garante um disparo num horário exato sem depender do agendamento do GitHub nem de um
# computador ligado: o job fica esperando nos servidores do GitHub (até 6 h) e, na hora,
# aciona o workflow "Publicar post". Uso: Actions → Despertador → Run workflow → hora.

on:
  workflow_dispatch:
    inputs:
      hora:
        description: 'Horário de Brasília para disparar a publicação (HH:MM), no máximo 5h50 à frente'
        required: true

permissions:
  actions: write

jobs:
  esperar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Esperar até o horário
        env:
          HORA: ${{ inputs.hora }}
        run: |
          alvo=$(TZ=America/Sao_Paulo date -d "today $HORA" +%s)
          agora=$(date +%s)
          echo "Disparo às $HORA (Brasília), daqui a $(( (alvo - agora) / 60 )) min"
          [ $alvo -gt $agora ] && sleep $(( alvo - agora )) || true

      - name: Acionar a publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --repo ${{ github.repository }}
